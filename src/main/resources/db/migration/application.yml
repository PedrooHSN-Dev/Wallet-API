spring:
datasource:
url: ${DB_URL:jdbc:postgresql://localhost:5432/securewallet}
username: ${DB_USERNAME:postgres}
password: ${DB_PASSWORD:postgres}
driver-class-name: org.postgresql.Driver
jpa:
hibernate:
ddl-auto: validate
show-sql: false
properties:
hibernate:
dialect: org.hibernate.dialect.PostgreSQLDialect
flyway:
enabled: true
locations: classpath:db/migration
server:
port: 8080
security:
jwt:
secret: ${JWT_SECRET:troque_em_producao_use_256_bits_minimo}
expiration: ${JWT_EXPIRATION:86400000}
